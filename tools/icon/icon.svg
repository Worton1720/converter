<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f72dc"/>
      <stop offset="1" stop-color="#163a78"/>
    </linearGradient>
    <clipPath id="pic"><rect x="152" y="214" width="236" height="170" rx="12"/></clipPath>
  </defs>
  <!-- плитка -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tile)"/>
  <!-- видео: карточка позади -->
  <g transform="rotate(-10 196 182)">
    <rect x="72" y="92" width="248" height="180" rx="24" fill="#9cc0f5"/>
    <path d="M128 140 L128 200 L178 170 Z" fill="#163a78" stroke="#163a78" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <!-- фото: карточка впереди -->
  <g transform="rotate(6 270 300)">
    <rect x="134" y="196" width="272" height="206" rx="24" fill="#ffffff"/>
    <g clip-path="url(#pic)">
      <rect x="152" y="214" width="236" height="170" fill="#d3e5ff"/>
      <circle cx="334" cy="258" r="24" fill="#ffb02e"/>
      <path d="M212 384 L308 296 L388 358 L388 384 Z" fill="#4a88ea"/>
      <path d="M152 384 L232 292 L316 384 Z" fill="#1f4f99"/>
    </g>
  </g>
  <!-- значок «преобразовать» -->
  <circle cx="398" cy="398" r="64" fill="#ff9a1a" stroke="#183f7d" stroke-width="14"/>
  <path d="M366 398 H426 M404 374 L430 398 L404 422" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
