name: CI

# Проверки на каждый push в dev (и любые ветки, кроме master) и на запросы на слияние.
# В master этот же набор вызывает release.yml — перед сборкой и выпуском.
on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_call:

# Новый push в ветку отменяет её прежний прогон: проверять имеет смысл только последнее.
# В master (вызов из release.yml) ничего не отменяется.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Системные зависимости
        timeout-minutes: 15
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libheif-dev liblcms2-dev ffmpeg
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev xvfb dbus-x11
          libheif-plugin-libde265
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Фронтенд (проверка типов и сборка — нужна для generate_context!)
        run: pnpm --dir app install --frozen-lockfile && pnpm --dir app build
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Автотесты интерфейса (правила ТЗ 8.5, сценарии 1–3)
        run: dbus-run-session -- tools/ui-test.sh
      - name: Итог автотестов интерфейса
        if: failure()
        run: |
          cat target/ui-test/result.log target/ui-test/vite.log 2>/dev/null | tail -50
          tail -30 target/ui-test/state/converter/logs/converter.log 2>/dev/null || true

  windows:
    timeout-minutes: 90
    runs-on: windows-latest
    env:
      # libheif и libde265 под LGPL — поставляем как DLL (раздел 8.4 ТЗ).
      VCPKGRS_DYNAMIC: 1
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Сборочный скрипт libheif-sys запоминает, с чем линковать; сменить ключ при смене фич libheif в vcpkg.
          key: libheif-de265
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: pnpm --dir app install --frozen-lockfile && pnpm --dir app build
      - name: Порт libheif в vcpkg
        id: libheif
        shell: pwsh
        # vcpkg на образах GitHub разной свежести: в новых портах libde265 — отдельная фича,
        # в старых — обязательная зависимость. Фичу hevc (x265, GPL) не берём: HEIC только читаем.
        run: |
          $m = Get-Content C:\vcpkg\ports\libheif\vcpkg.json | ConvertFrom-Json
          $f = if ($m.features.PSObject.Properties.Name -contains 'libde265') { 'core,libde265' } else { 'core' }
          "spec=libheif[$f]:x64-windows" >> $env:GITHUB_OUTPUT
          "key=$($m.version)-$($f -replace ',', '-')" >> $env:GITHUB_OUTPUT
      - name: Кэш vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libheif-${{ runner.os }}-${{ steps.libheif.outputs.key }}
      - name: libheif через vcpkg
        shell: pwsh
        run: |
          vcpkg install "${{ steps.libheif.outputs.spec }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin = "C:\vcpkg\installed\x64-windows\bin"
          if (Test-Path "$bin\libx265.dll") { throw "libx265.dll (GPL) не должна попадать в поставку" }
          if (-not (Test-Path "$bin\libde265.dll")) { throw "нет libde265.dll — HEIC не будет открываться" }
      - name: Ресурсы из tauri.windows.conf.json (DLL libheif; ffmpeg для проверок не нужен — заглушка)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/resources/windows-dlls, app/src-tauri/resources/ffmpeg | Out-Null
          Copy-Item C:\vcpkg\installed\x64-windows\bin\*.dll app/src-tauri/resources/windows-dlls/
          Set-Content app/src-tauri/resources/ffmpeg/README.txt "CI: встроенный ffmpeg нужен только выпуску"
      - run: cargo clippy --all-targets -- -D warnings
      - name: Тесты (интеграционные пропускаются без ffmpeg и образцов)
        run: |
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;$env:PATH"
          cargo test
