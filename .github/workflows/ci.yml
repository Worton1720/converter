name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Системные зависимости
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libheif-dev liblcms2-dev ffmpeg
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Фронтенд (проверка типов и сборка — нужна для generate_context!)
        run: pnpm --dir app install --frozen-lockfile && pnpm --dir app build
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    runs-on: windows-latest
    env:
      # libheif и libde265 под LGPL — поставляем как DLL (раздел 8.4 ТЗ).
      VCPKGRS_DYNAMIC: 1
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: pnpm --dir app install --frozen-lockfile && pnpm --dir app build
      - name: Кэш vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libheif-de265-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: vcpkg-libheif-de265-${{ runner.os }}-
      - name: libheif через vcpkg
        run: vcpkg install "libheif[core,libde265]:x64-windows"
      - name: Ресурсы из tauri.windows.conf.json (DLL libheif; ffmpeg для проверок не нужен — заглушка)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/resources/windows-dlls, app/src-tauri/resources/ffmpeg | Out-Null
          Copy-Item C:\vcpkg\installed\x64-windows\bin\*.dll app/src-tauri/resources/windows-dlls/
          Set-Content app/src-tauri/resources/ffmpeg/README.txt "CI: встроенный ffmpeg нужен только выпуску"
      - run: cargo clippy --all-targets -- -D warnings
      - name: Тесты (интеграционные пропускаются без ffmpeg и образцов)
        run: |
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;$env:PATH"
          cargo test
