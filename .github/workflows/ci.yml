name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libheif-dev liblcms2-dev ffmpeg
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Фронтенд (проверка типов и сборка — нужна для generate_context!)
        run: pnpm --dir app install --frozen-lockfile && pnpm --dir app build
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    runs-on: windows-latest
    env:
      # libheif и libde265 под LGPL — поставляем как DLL (раздел 8.4 ТЗ).
      VCPKGRS_DYNAMIC: 1
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: pnpm --dir app install --frozen-lockfile && pnpm --dir app build
      - name: libheif через vcpkg
        run: vcpkg install libheif:x64-windows
      - run: cargo clippy --all-targets -- -D warnings
      - name: Тесты (интеграционные пропускаются без ffmpeg и образцов)
        run: |
          $env:PATH = "C:\vcpkg\installed\x64-windows\bin;$env:PATH"
          cargo test
