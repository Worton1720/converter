name: Release

# Разработка идёт в dev; слияние dev → master запускает полный процесс:
#   1. все проверки ci.yml на Linux и Windows (fmt, clippy, тесты);
#   2. сборка пакетов и дымовой тест готовых программ (tools/smoke-test.sh);
#   3. выпуск vX.Y.Z на GitHub — если версии из Cargo.toml ещё нет среди тегов, вместе с
#      latest.json для автообновления (подписи — ключом из секретов TAURI_SIGNING_PRIVATE_KEY*).
# Новая версия готовится в dev командой tools/release.sh X.Y.Z. Без неё слияние только
# проверяет и собирает пакеты (они остаются в артефактах прогона). Ручной запуск — тоже без выпуска.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # libjpeg-turbo из исходников со SIMD, статически (crates/core/Cargo.toml): нужны cmake и nasm.
  TURBOJPEG_SOURCE: vendor
  TURBOJPEG_STATIC: "1"

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  check:
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
      - name: Версия и нужен ли выпуск
        id: v
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for f in app/package.json app/src-tauri/tauri.conf.json; do
            v=$(jq -r .version "$f")
            [[ "$v" == "$version" ]] || { echo "::error file=$f::версия $v, а в Cargo.toml $version"; exit 1; }
          done
          publish=false
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            echo "::notice::ручной запуск — только сборка, без выпуска"
          elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::notice::версия $version уже выпущена — только проверки и сборка. Для выпуска: tools/release.sh в dev"
          else
            grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error file=CHANGELOG.md::нет раздела [$version]"; exit 1; }
            publish=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  linux:
    timeout-minutes: 90
    needs: [tests, check]
    # 22.04 — чтобы AppImage запускался на старых системах (glibc 2.35). libheif вшивается
    # в программу (embedded-libheif), поэтому системная libheif 1.12 не мешает.
    # .deb требует ffmpeg ≥ 6.1 из системы — ставится на Ubuntu 24.04 и новее.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Системные зависимости
        timeout-minutes: 45
        run: >
          tools/apt-install.sh pkg-config nasm cmake libde265-dev
          liblcms2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libfuse2 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Сборка .deb и AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tools/build-linux.sh
      - name: Командная строка
        run: cargo build --release -p converter-cli --features embedded-libheif
      - name: Файлы выпуска
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb "dist/Converter-$VERSION-linux-amd64.deb"
          cp target/release/bundle/appimage/*.AppImage "dist/Converter-$VERSION-linux-x86_64.AppImage"
          tar -C target/release -czf "dist/converter-cli-$VERSION-linux-x86_64.tar.gz" converter
          # Подписи обновлений — отдельно: в список «что скачать» они не попадают.
          mkdir updater
          shopt -s nullglob
          for f in target/release/bundle/deb/*.deb.sig; do cp "$f" "updater/Converter-$VERSION-linux-amd64.deb.sig"; done
          for f in target/release/bundle/appimage/*.AppImage.sig; do cp "$f" "updater/Converter-$VERSION-linux-x86_64.AppImage.sig"; done
          ls -la updater
      - name: Дымовой тест
        run: PATH="$PWD/app/src-tauri/resources/ffmpeg:$PATH" tools/smoke-test.sh target/release/converter
      - name: Состав пакетов
        run: |
          dpkg-deb -c dist/*.deb | grep -q 'usr/bin/converter-app$' || { echo "::error::в .deb нет программы"; exit 1; }
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-extract >/dev/null
          squashfs-root/usr/lib/Converter/ffmpeg/ffmpeg -version | head -1
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: updater-linux
          path: updater/*
          if-no-files-found: ignore

  windows:
    timeout-minutes: 90
    needs: [tests, check]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # libheif и libde265 под LGPL — поставляются как DLL рядом с программой (ТЗ 8.4).
      VCPKGRS_DYNAMIC: 1
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Сборочный скрипт libheif-sys запоминает, с чем линковать; сменить ключ при смене фич libheif в vcpkg.
          key: libheif-de265
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: ilammy/setup-nasm@v1
      - name: Порт libheif в vcpkg
        id: libheif
        shell: pwsh
        # vcpkg на образах GitHub разной свежести: в новых портах libde265 — отдельная фича,
        # в старых — обязательная зависимость. Фичу hevc (x265, GPL) не берём: HEIC только читаем.
        run: |
          $m = Get-Content C:\vcpkg\ports\libheif\vcpkg.json | ConvertFrom-Json
          $f = if ($m.features.PSObject.Properties.Name -contains 'libde265') { 'core,libde265' } else { 'core' }
          "spec=libheif[$f]:x64-windows" >> $env:GITHUB_OUTPUT
          "key=$($m.version)-$($f -replace ',', '-')" >> $env:GITHUB_OUTPUT
      - name: Кэш vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libheif-${{ runner.os }}-${{ steps.libheif.outputs.key }}
      - name: libheif через vcpkg
        shell: pwsh
        run: |
          vcpkg install "${{ steps.libheif.outputs.spec }}"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bin = "C:\vcpkg\installed\x64-windows\bin"
          if (Test-Path "$bin\libx265.dll") { throw "libx265.dll (GPL) не должна попадать в поставку" }
          if (-not (Test-Path "$bin\libde265.dll")) { throw "нет libde265.dll — HEIC не будет открываться" }
      - name: DLL рядом с программой
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/resources/windows-dlls | Out-Null
          Copy-Item C:\vcpkg\installed\x64-windows\bin\*.dll app/src-tauri/resources/windows-dlls/
      - name: Встроенный ffmpeg
        shell: bash
        run: tools/fetch-ffmpeg.sh windows
      - name: Установщик NSIS
        working-directory: app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          # Без ключа подписи (например, в форке) — без файлов автообновления.
          $unsigned = @()
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { $unsigned = @('--config', '{"bundle":{"createUpdaterArtifacts":false}}') }
          pnpm tauri build --bundles nsis @unsigned
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Командная строка
        run: cargo build --release -p converter-cli
      - name: Файлы выпуска
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Get-Item target/release/bundle/nsis/*.exe) "dist/Converter-$env:VERSION-windows-x64-setup.exe"
          $dir = "Converter-portable"
          New-Item -ItemType Directory -Force "$dir/ffmpeg" | Out-Null
          Copy-Item target/release/converter-app.exe "$dir/Converter.exe"
          Copy-Item target/release/converter.exe "$dir/converter-cli.exe"
          Copy-Item app/src-tauri/resources/windows-dlls/*.dll $dir/
          Copy-Item app/src-tauri/resources/ffmpeg/* "$dir/ffmpeg/"
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/Converter-$env:VERSION-windows-x64-portable.zip"
          $cli = "converter-cli"
          New-Item -ItemType Directory -Force $cli | Out-Null
          Copy-Item target/release/converter.exe $cli/
          Copy-Item app/src-tauri/resources/windows-dlls/*.dll $cli/
          Compress-Archive -Path "$cli/*" -DestinationPath "dist/converter-cli-$env:VERSION-windows-x64.zip"
          New-Item -ItemType Directory -Force updater | Out-Null
          Get-Item target/release/bundle/nsis/*.exe.sig -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_ "updater/Converter-$env:VERSION-windows-x64-setup.exe.sig" }
      - name: Распаковать CLI для проверки
        shell: pwsh
        run: Expand-Archive "dist/converter-cli-$env:VERSION-windows-x64.zip" "$env:RUNNER_TEMP/smoke-cli"
      - name: Дымовой тест (программа из архива — проверяет и DLL рядом с ней)
        shell: bash
        run: PATH="$PWD/app/src-tauri/resources/ffmpeg:$PATH" tools/smoke-test.sh "$RUNNER_TEMP/smoke-cli/converter.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows
          path: updater/*
          if-no-files-found: ignore

  release:
    timeout-minutes: 90
    if: needs.check.outputs.publish == 'true'
    needs: [check, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: "{linux,windows}"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater
          merge-multiple: true
      - name: latest.json для автообновления
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          appimage="Converter-$VERSION-linux-x86_64.AppImage"
          deb="Converter-$VERSION-linux-amd64.deb"
          nsis="Converter-$VERSION-windows-x64-setup.exe"
          for f in "$appimage" "$deb" "$nsis"; do
            [[ -f "updater/$f.sig" ]] || { echo "::warning::нет подписи $f — выпуск без автообновления"; exit 0; }
          done
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > changes.md
          entry() { jq -n --arg url "$base/$1" --arg sig "$(cat "updater/$1.sig")" '{url: $url, signature: $sig}'; }
          # Ключ с типом пакета выбирает установленная программа; без него — переносная версия
          # и старые сборки (им достаточно узнать о новой версии).
          jq -n --arg v "$VERSION" --arg date "$(date -u +%FT%TZ)" --rawfile notes changes.md \
            --argjson appimage "$(entry "$appimage")" --argjson deb "$(entry "$deb")" --argjson nsis "$(entry "$nsis")" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
              "linux-x86_64-appimage": $appimage, "linux-x86_64-deb": $deb, "linux-x86_64": $appimage,
              "windows-x86_64-nsis": $nsis, "windows-x86_64": $nsis}}' > dist/latest.json
          cat dist/latest.json
      - name: Контрольные суммы
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Описание выпуска из CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          cat tools/release-notes-footer.md >> notes.md
          cat notes.md
      - name: Выпуск на GitHub
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          # Тег vX.Y.Z ставится на проверенный коммит master.
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Converter $VERSION" --notes-file notes.md "${flags[@]}"
