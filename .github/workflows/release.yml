name: Release

# Выпуск: tools/release.sh X.Y.Z (поднимает версии, коммит и тег vX.Y.Z) → git push --follow-tags.
# По тегу собираются пакеты для Linux и Windows и публикуется выпуск на GitHub с описанием
# из CHANGELOG.md. Ручной запуск (workflow_dispatch) только собирает пакеты — без выпуска.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Версия в теге и в файлах проекта совпадает
        id: v
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for f in app/package.json app/src-tauri/tauri.conf.json; do
            v=$(jq -r .version "$f")
            [[ "$v" == "$version" ]] || { echo "::error file=$f::версия $v, а в Cargo.toml $version"; exit 1; }
          done
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::тег $GITHUB_REF_NAME не совпадает с версией проекта $version"; exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error file=CHANGELOG.md::нет раздела [$version]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: check
    # 22.04 — чтобы AppImage запускался на старых системах (glibc 2.35). libheif вшивается
    # в программу (embedded-libheif), поэтому системная libheif 1.12 не мешает.
    # .deb требует ffmpeg ≥ 6.1 из системы — ставится на Ubuntu 24.04 и новее.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Системные зависимости
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config cmake libde265-dev
          liblcms2-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libfuse2 file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Сборка .deb и AppImage
        run: tools/build-linux.sh
      - name: Командная строка
        run: cargo build --release -p converter-cli --features embedded-libheif
      - name: Файлы выпуска
        run: |
          mkdir dist
          cp target/release/bundle/deb/*.deb "dist/Converter-$VERSION-linux-amd64.deb"
          cp target/release/bundle/appimage/*.AppImage "dist/Converter-$VERSION-linux-x86_64.AppImage"
          tar -C target/release -czf "dist/converter-cli-$VERSION-linux-x86_64.tar.gz" converter
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      # libheif и libde265 под LGPL — поставляются как DLL рядом с программой (ТЗ 8.4).
      VCPKGRS_DYNAMIC: 1
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Кэш vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libheif-de265-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: vcpkg-libheif-de265-${{ runner.os }}-
      - name: libheif через vcpkg
        run: vcpkg install "libheif[core,libde265]:x64-windows"
      - name: DLL рядом с программой
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/resources/windows-dlls | Out-Null
          Copy-Item C:\vcpkg\installed\x64-windows\bin\*.dll app/src-tauri/resources/windows-dlls/
      - name: Встроенный ffmpeg
        shell: bash
        run: tools/fetch-ffmpeg.sh windows
      - name: Установщик NSIS
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis
      - name: Командная строка
        run: cargo build --release -p converter-cli
      - name: Файлы выпуска
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item (Get-Item target/release/bundle/nsis/*.exe) "dist/Converter-$env:VERSION-windows-x64-setup.exe"
          $dir = "Converter-portable"
          New-Item -ItemType Directory -Force "$dir/ffmpeg" | Out-Null
          Copy-Item target/release/converter-app.exe "$dir/Converter.exe"
          Copy-Item target/release/converter.exe "$dir/converter-cli.exe"
          Copy-Item app/src-tauri/resources/windows-dlls/*.dll $dir/
          Copy-Item app/src-tauri/resources/ffmpeg/* "$dir/ffmpeg/"
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/Converter-$env:VERSION-windows-x64-portable.zip"
          $cli = "converter-cli"
          New-Item -ItemType Directory -Force $cli | Out-Null
          Copy-Item target/release/converter.exe $cli/
          Copy-Item app/src-tauri/resources/windows-dlls/*.dll $cli/
          Compress-Archive -Path "$cli/*" -DestinationPath "dist/converter-cli-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: [check, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Контрольные суммы
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Описание выпуска из CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found' CHANGELOG.md > notes.md
          cat tools/release-notes-footer.md >> notes.md
          cat notes.md
      - name: Выпуск на GitHub
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "Converter $VERSION" --notes-file notes.md --verify-tag "${flags[@]}"
