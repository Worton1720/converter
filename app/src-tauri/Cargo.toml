[package]
name = "converter-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "converter_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
embedded-libheif = ["converter-core/embedded-libheif"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
converter-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-notification = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-window-state = "2.5"
keepawake = "0.6"
percent-encoding = "2"
