[package]
name = "converter-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# libheif 1.23 собирается из исходников статически, со встроенным libde265 (без плагинов):
# для AppImage/.deb, не зависящих от версии и плагинов libheif в системе.
embedded-libheif = ["libheif-rs/embedded-libheif"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
libheif-rs = { version = "3", default-features = false, features = ["v1_17"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
png = "0.18"
# Кодирование JPEG: libjpeg-turbo с SIMD — на 15 % быстрее пачки и на 27 % быстрее одного фото,
# чем jpeg-encoder (замер 2026-10-23, docs/LESSONS.md). Источник библиотеки — TURBOJPEG_SOURCE:
# в CI и выпусках «vendor» (сборка из исходников, статически, нужен nasm), локально по умолчанию
# «pkg-config» (.cargo/config.toml) — системная libjpeg-turbo ≥ 3.0. Без SIMD сборка падает.
turbojpeg = { version = "1.5", default-features = false, features = ["cmake", "pkg-config", "require-simd"] }
webp = "0.3"
fast_image_resize = "5"
lcms2 = "6"
blake3 = "1"
sysinfo = "0.39"
walkdir = "2"
trash = "5"
dirs = "7"
file-id = "0.2"
toml = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
